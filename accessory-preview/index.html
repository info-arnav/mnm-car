<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Scorpio-N · Accessories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="viewer" class="viewer" aria-label="Drag or swipe to rotate the car" tabindex="0">
    <div class="stage">
      <img id="car" src="../frames/000.webp" draggable="false" alt="Scorpio-N exterior, interactive rotating view">
      <svg id="accessory" viewBox="0 0 1600 900" aria-hidden="true"></svg>
    </div>
  </main>
  <aside class="accessories" aria-label="Accessory selector">
    <div class="panel-heading"><strong>Make it yours</strong><span>SCORPIO-N</span></div>
    <label for="roof-option">Roof accessories</label>
    <select id="roof-option">
      <option value="none">Original vehicle</option>
      <option value="crossbars">Roof cross bars</option>
      <option value="carrier">Integrated roof carrier</option>
    </select>
    <p id="selection-note" aria-live="polite">Select an accessory to preview it on the car.</p>
    <div class="panel-footer"><span>Illustrative preview · fit may vary</span><button id="reset" type="button">Reset</button></div>
    <a href="https://auto.mahindra.com/on/demandware.static/-/Sites-amc-Library/default/dwb7ea1770/SCN/pdfs/Scorpio-Accessories-E-Brochure.pdf" target="_blank" rel="noopener">View Mahindra accessory brochure ↗</a>
  </aside>
  <script src="accessories.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
